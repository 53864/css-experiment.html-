<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter 6 | CSS Layout Lab</title>
  <link rel="stylesheet" href="experiment.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <h1>Dove Shampoo<h1>
      <p>Find Good Quality</p>
    </header>
    <nav aria-label="Page navigation"><a href="#home">Home</a> <a href="#services">Services</a> 
      <a href="#About">About</a>
    </nav>
    <main>
      <section id="feature" class="feature">
        <div class="feature-content"></div>
      </section>
      <section id="box-model" class="panel">
        <h2>Shop online and get a free sample!</h2>
        <p>Your hair deserves the best.</p>
      </section>
      <section id="cards" class="cards" aria-label="Example cards">
        <article class="card">
          <h2>Shop Now! 
          </h2>
          <p>Buy 2 get 1 Free!</p>
          </article>
      </section>
    </main>
    <footer>Dove Shampoo</footer>
  </div>
</body>
